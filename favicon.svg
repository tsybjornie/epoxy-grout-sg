<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#080C14"/>
  <!-- tile grid with one gold joint — the product as the mark -->
  <g stroke="#D4AF37" stroke-width="3">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
  </g>
  <g fill="#F5F2EB" opacity="0.92">
    <rect x="12" y="12" width="17" height="17" rx="2"/>
    <rect x="35" y="12" width="17" height="17" rx="2"/>
    <rect x="12" y="35" width="17" height="17" rx="2"/>
    <rect x="35" y="35" width="17" height="17" rx="2"/>
  </g>
</svg>
